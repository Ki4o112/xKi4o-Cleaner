  --font: "Montserrat", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(900px 500px at 92% -10%, rgba(var(--blue-rgb),.16), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(var(--blue-rgb),.08), transparent 60%),
    var(--bg);
  color: var(--text);
  font: 500 14px/1.45 var(--font);
  font-feature-settings: "tnum" 1, "locl" 0;
  -webkit-locale: "en";
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
  cursor: default;
}
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 3px; }
::selection { background: var(--blue-soft); }

.shell { display: grid; grid-template-columns: 228px 1fr; gap: 12px; padding: 12px; height: 100vh; }

/* ================= Sidebar ================= */
.side { background: var(--panel); border-radius: var(--r-xl); padding: 20px 12px 16px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.03); min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 22px; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-ver { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.nav-ind { position: absolute; left: 0; right: 0; top: 0; height: 48px; border-radius: 16px; background: var(--card-2); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 24px -14px rgba(0,0,0,.8); transition: transform .45s var(--spring), height .3s var(--ease); pointer-events: none; }
.nav button { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 10px; border: 0; background: none; border-radius: 16px; color: var(--muted); cursor: pointer; text-align: left; font-weight: 600; font-size: 13.5px; transition: color .2s, transform .2s var(--spring); overflow: hidden; }
.nav button:hover { color: var(--text); }
.nav button:active { transform: scale(.96); }
.nav .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--card); transition: background .3s, color .3s, transform .4s var(--spring); flex: none; }
.nav button[aria-current="page"] { color: var(--text); }
.nav button[aria-current="page"] .ico { background: var(--blue); color: #fff; box-shadow: 0 6px 18px -6px var(--blue-glow); transform: rotate(-8deg) scale(1.05); }
.nav .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .badge { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 700; padding: 3px 7px; letter-spacing: -.1px; border-radius: 99px; background: var(--blue-soft); color: var(--blue-light); white-space: nowrap; animation: pop .4s var(--spring); }
.nav .live { margin-left: auto; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(54,211,153,.6); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(54,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(54,211,153,0); } }
.side-foot { margin-top: auto; padding: 14px 8px 0; display: flex; flex-direction: column; gap: 12px; }
.mini-ram { background: var(--card); border-radius: 16px; padding: 12px 12px 11px; cursor: pointer; transition: transform .2s var(--spring), background .2s; }
.mini-ram:hover { background: var(--card-2); }
.mini-ram:active { transform: scale(.97); }
.mini-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.mini-top b { color: var(--text); font-weight: 700; }
.mini-bar { height: 6px; border-radius: 4px; background: #0d1326; margin-top: 8px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--blue-2)); transition: width .8s var(--ease), background .4s; }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); flex: none; }
.dot.warn { background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
.os { color: var(--faint); font-size: 11.5px; }

/* ================= Main ================= */
.main { background: var(--panel); border-radius: var(--r-xl); border: 1px solid rgba(255,255,255,.03); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.page { display: none; flex-direction: column; flex: 1; min-height: 0; }
.page.on { display: flex; animation: pageIn .45s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px) scale(.995); } to { opacity: 1; transform: none; } }
.head { display: flex; align-items: center; gap: 14px; padding: 20px 26px 0; }
.head-ico { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--blue-2); flex: none; }
h1 { font-size: 23px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.head-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.scroll { overflow-y: auto; min-height: 0; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: #26304f; border-radius: 6px; border: 3px solid var(--panel); }
.pad { padding: 18px 26px 26px; }

/* ================= Buttons ================= */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; padding: 0 20px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--card-2); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: transform .25s var(--spring), background .2s, box-shadow .3s, opacity .2s; }
.btn:hover:not([disabled]) { background: var(--card-hi); transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: scale(.95); transition-duration: .08s; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--blue-hi), var(--blue) 55%, var(--blue-deep)); border-color: transparent; color: #fff; box-shadow: 0 10px 30px -10px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.primary:hover:not([disabled]) { box-shadow: 0 14px 38px -10px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.22); background: linear-gradient(135deg, var(--blue-2), var(--blue) 55%, var(--blue-deep)); }
.btn.big { height: 52px; padding: 0 26px; font-size: 14.5px; border-radius: 16px; }
.btn.small { height: 34px; padding: 0 14px; font-size: 12.5px; border-radius: 11px; }
.btn.danger { background: var(--red-soft); border-color: rgba(255,107,122,.35); color: #ffc1c8; }
.btn.ghost { background: transparent; }
.icon-btn { width: 44px; padding: 0; }
.icon-btn.spin svg { animation: rot 1s linear infinite; }
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.28); transform: scale(0); animation: ripple .6s var(--ease) forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
@keyframes rot { to { transform: rotate(360deg); } }

/* ================= Segmented pill ================= */
.seg { position: relative; display: inline-flex; padding: 4px; border-radius: 15px; background: #0c1226; border: 1px solid var(--line-soft); }
.seg button { position: relative; z-index: 1; border: 0; background: none; height: 34px; min-width: 48px; padding: 0 12px; border-radius: 11px; color: var(--muted); font-weight: 600; font-size: 12.5px; cursor: pointer; transition: color .2s, transform .2s var(--spring); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.seg button:active { transform: scale(.93); }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg-thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 11px; background: var(--card-2); box-shadow: 0 6px 16px -8px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06); transition: transform .45s var(--spring), width .35s var(--ease); }
.seg.blue .seg-thumb { background: var(--blue); box-shadow: 0 6px 18px -6px var(--blue-glow); }
.seg.blue button[aria-pressed="true"] { color: #fff; }

/* ================= Hero ================= */
.hero { margin: 16px 26px 0; padding: 18px 22px 16px; border-radius: var(--r-l); background: linear-gradient(160deg, #18213d, #131a31); border: 1px solid rgba(255,255,255,.04); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -120px; top: -160px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--blue-rgb),.22), transparent 65%); pointer-events: none; }
.hero-row { display: flex; align-items: flex-end; gap: 20px; position: relative; z-index: 1; }
.big { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.035em; color: #fff; }
.big.freed { color: var(--mint); }
.big-label { color: var(--muted); margin-top: 8px; font-size: 13px; }
.hero-num { min-width: 0; }
.hero-side { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.hero-actions { display: flex; gap: 10px; align-items: center; }
.hero .status { margin: 0; text-align: right; max-width: 460px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.drive-meta { margin-left: auto; color: var(--muted); }
.drive-meta b { color: var(--text); }
.drivebar { position: relative; z-index: 1; height: 12px; margin-top: 16px; border-radius: 9px; background: #0c1226; overflow: hidden; display: flex; }
.drivebar .s { height: 100%; transition: width 1s var(--ease); }
.s.used { background: #34405f; }
.s.reclaim { background: repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 4px, transparent 4px 9px), var(--blue); }
.s.gained { background: var(--mint); }
.legend { display: flex; gap: 18px; margin-top: 10px; color: var(--muted); font-size: 11.5px; position: relative; z-index: 1; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.sw.used { background: #34405f; } .sw.reclaim { background: var(--blue); } .sw.gained { background: var(--mint); } .sw.free { background: #0c1226; box-shadow: inset 0 0 0 1px var(--line); }
.progress { height: 4px; border-radius: 3px; background: #0c1226; margin-top: 14px; overflow: hidden; position: relative; z-index: 1; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--blue-2)); transition: width .35s var(--ease); border-radius: 3px; }
.progress.indet i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.status { color: var(--muted); font-size: 12.5px; margin-top: 10px; min-height: 18px; position: relative; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.04); z-index: 2; }
.hero-prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--blue-light)); box-shadow: 0 0 12px var(--blue-glow); transition: width .35s var(--ease); }
.hero-prog.indet i { width: 30%; animation: slide 1.1s ease-in-out infinite; }

/* ================= Sticky action bar ================= */
.sticky-wrap { position: sticky; top: 0; height: 0; z-index: 6; }
.sticky { position: absolute; left: 26px; right: 26px; top: 10px; display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 16px;
  background: rgba(22, 29, 52, .97); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 18px 40px -20px rgba(0,0,0,.9);
  transform: translateY(-160%); opacity: 0; pointer-events: none; transition: transform .45s var(--spring), opacity .25s; }
.sticky.on { transform: none; opacity: 1; pointer-events: auto; }
.sticky::before { content: ""; position: absolute; left: -27px; right: -27px; top: -11px; height: 11px; background: var(--panel); }
.st-num { font-weight: 800; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
.st-label { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* ================= Group cards ================= */
.cards { display: flex; gap: 12px; padding: 14px 26px 18px; margin-bottom: -14px; scroll-padding: 0 26px; overflow-x: auto; scroll-snap-type: x proximity; perspective: 900px; flex: none; }
.cards::-webkit-scrollbar { height: 0; }
.cards { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 46px), transparent); padding-right: 46px; }
.gcard { position: relative; flex: 0 0 214px; min-height: 112px; padding: 13px 14px 11px; border-radius: var(--r-l); background: var(--card); border: 1px solid rgba(255,255,255,.035); cursor: pointer; text-align: left; overflow: hidden; scroll-snap-align: start; transition: transform .35s var(--spring), background .3s, box-shadow .3s; transform-style: preserve-3d; }
.gcard:hover { background: var(--card-2); }
.gcard:active { transform: scale(.96) !important; transition-duration: .1s; }
.gcard::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 190px; height: 190px; border-radius: 50%; border: 1px solid rgba(255,255,255,.04); box-shadow: 0 0 0 26px rgba(255,255,255,.015); pointer-events: none; }
.gcard.on { background: linear-gradient(145deg, var(--blue-hi), var(--blue) 50%, var(--blue-deep)); box-shadow: 0 18px 40px -16px var(--blue-glow); }
.g-top { display: flex; align-items: center; gap: 9px; }
.g-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; flex: none; transition: transform .45s var(--spring), background .3s, color .3s; }
.gcard:hover .g-ico { transform: rotate(-10deg) scale(1.06); }
.gcard.on .g-ico { background: #fff; color: var(--blue); }
.g-head { display: flex; flex-direction: column; justify-content: center; min-width: 0; min-height: 34px; line-height: 1.25; }
.g-name { font-weight: 700; font-size: 14px; letter-spacing: -.1px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-total { font-weight: 700; font-size: 12.5px; white-space: nowrap; color: var(--blue-light); }
.g-total:empty { display: none; }
.gcard.on .g-total { color: rgba(255,255,255,.85); }
.g-lines { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
.g-line { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
.g-line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.g-line span:last-child { color: var(--text); font-weight: 600; flex: none; }
.gcard.on .g-line { color: rgba(255,255,255,.75); }
.gcard.on .g-line span:last-child { color: #fff; }

/* ================= Table ================= */
.clean-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.clean-body::-webkit-scrollbar { width: 10px; }
.clean-body::-webkit-scrollbar-thumb { background: #26304f; border-radius: 6px; border: 3px solid var(--panel); }
.clean-body > * { flex-shrink: 0; }
.clean-body > .table { flex: 1 0 330px; }
.table { margin: 12px 26px 20px; border-radius: var(--r-l); background: var(--card); border: 1px solid rgba(255,255,255,.035); display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
.tbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line-soft); }
.tbar-t { color: var(--faint); font-size: 12px; font-weight: 600; margin-left: 2px; }
.search { position: relative; margin-left: auto; flex: 0 1 260px; min-width: 120px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 34px; border-radius: 11px; border: 1px solid var(--line-soft); background: #0c1226; padding: 0 12px 0 36px; font-size: 12.5px; font-weight: 500; outline: none; transition: border-color .2s, box-shadow .2s, background .2s; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); background: #0e1530; }
.search input::-webkit-search-cancel-button { filter: invert(.6); }
.tbar .seg { padding: 3px; border-radius: 12px; }
.tbar .seg button { height: 28px; min-width: 0; padding: 0 10px; font-size: 12px; border-radius: 9px; }
.tbar .seg-thumb { top: 3px; bottom: 3px; border-radius: 9px; }
.tbar .icon-btn { width: 34px; height: 34px; padding: 0; }
.tbar .icon-btn[aria-pressed="true"] { color: var(--blue-light); border-color: rgba(var(--blue-rgb), .45); background: var(--blue-soft); }
.tfoot { padding: 10px 18px 14px; color: var(--faint); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue-light); font-weight: 600; font-size: 12px; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.empty { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 13px; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.tbody { overflow-y: auto; min-height: 0; flex: 1; padding: 4px 0 8px; }
.tbody::-webkit-scrollbar { width: 10px; }
.tbody::-webkit-scrollbar-thumb { background: #26304f; border-radius: 6px; border: 3px solid var(--card); }
.tsec { padding: 12px 18px 6px; color: var(--faint); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.tsec .n { color: var(--muted); font-weight: 600; margin-left: auto; }
.row { display: grid; grid-template-columns: 30px 40px 1fr auto 70px 96px; gap: 0 12px; align-items: center; padding: 10px 18px; min-height: 60px; transition: background .2s; position: relative; }
.row:hover { background: rgba(255,255,255,.02); }
.row.off .name, .row.off .desc, .row.off .r-ico { opacity: .45; }
.row.run { background: var(--blue-soft); }
.r-ico { width: 34px; height: 34px; border-radius: 50%; background: var(--card-2); color: var(--blue-2); display: grid; place-items: center; transition: transform .4s var(--spring); }
.row:hover .r-ico { transform: scale(1.08) rotate(-6deg); }
.r-ico.av { background: var(--av); color: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 6px 14px -8px var(--av); }
.sbar { height: 5px; border-radius: 3px; background: #0c1226; overflow: hidden; }
.sbar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--blue), var(--blue-2)); width: 0; transition: width .6s var(--ease); }
.row.off .sbar i { background: #34405f; }
.name { font-weight: 600; font-size: 13.5px; }
.desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
.size { text-align: right; font-weight: 700; font-size: 13.5px; }
.size.dim { color: var(--faint); font-weight: 600; }
.size.ok { color: var(--mint); }
.size.bad { color: var(--red); }
.chip { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
.chip.open { background: var(--red-soft); color: #ffb3bc; }
.chip.opt { background: var(--blue-soft); color: var(--blue-light); }
.skel { display: inline-block; width: 56px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--card-2), #2a3557, var(--card-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); border-top-color: var(--blue-2); display: inline-block; animation: rot .7s linear infinite; vertical-align: -3px; }

/* checkbox */
.cb { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; border-radius: 7px; border: 1.6px solid #36416a; background: #0f1530; display: grid; place-content: center; cursor: pointer; transition: background .2s, border-color .2s, transform .3s var(--spring); }
.cb:hover:not(:disabled) { border-color: #5469a5; }
.cb:checked, .cb:indeterminate { background: var(--blue); border-color: var(--blue); box-shadow: 0 4px 12px -4px var(--blue-glow); animation: pop .35s var(--spring); }
.cb:checked::after { content: ""; width: 9px; height: 5px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
.cb:indeterminate::after { content: ""; width: 9px; height: 2px; background: #fff; border-radius: 1px; }
.cb:disabled { opacity: .35; cursor: not-allowed; }
@keyframes pop { 0% { transform: scale(.8); } 100% { transform: scale(1); } }

.dism-opt { margin-top: 8px; }
.dism-note { font-size: 11.5px; color: var(--faint); margin-top: 6px; }

/* ================= Notices ================= */
.notice { display: flex; align-items: center; gap: 14px; margin: 12px 26px 0; padding: 8px 8px 8px 14px; border-radius: var(--r-m); background: var(--red-soft); color: #ffd4d9; font-size: 12.5px; animation: pageIn .35s var(--ease); }
.notice.info { background: var(--card); color: var(--muted); }
.notice p { margin: 0; flex: 1; }

/* ================= Memory ================= */
.mem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; align-items: start; }
.mem-top .gauge-wrap { gap: 26px; }
.mem-right { flex: 1; min-width: 0; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
.panel { background: var(--card); border-radius: var(--r-l); border: 1px solid rgba(255,255,255,.035); padding: 18px; position: relative; overflow: hidden; }

// Ripple on every button-like element
document.addEventListener("pointerdown", e => {

function makeSeg(el, options, value, onChange) {

  const set = v => { el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); place(); };
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (b.disabled) return; set(b.dataset.v); onChange(b.dataset.v); }));

  const st = (TW.state[m.id] || {}).state;
  if (TW.filter === "on" && !(st === "on" || st === "partial")) return false;
  if (TW.filter === "rec" && !m.rec) return false;
  if (TW.q && !(twName(m.id) + " " + t("tw." + m.id + ".d")).toLowerCase().includes(TW.q)) return false;
  return true;
}
function twRowHtml(m) {
  const b = [];
  if (m.rec) b.push(["rec", t("tw.b.rec")]);
  if (m.risk === "risky") b.push(["risky", t("tw.b.risky")]); else if (m.risk === "caution") b.push(["caution", t("tw.b.caution")]);
  if (m.oneWay) b.push(["oneway", t("tw.b.oneway")]);
  if (m.reboot) b.push(["", t("tw.b.reboot")]);
  if (m.explorer) b.push(["", t("tw.b.explorer")]);
  const w = twWarn(m.id);
  const ctl = m.id === "debloat" ? `<button class="btn small" data-choose>${esc(t("tw.choose"))}</button>` : `<input type="checkbox" class="switch" aria-label="${esc(twName(m.id))}">`;
  return `<div class="tw-row" data-tw="${m.id}">
    <span class="r-ico">${ICONS[TW_ICON[m.group]] || ""}</span>
    <div><div class="tw-t"><span>${esc(twName(m.id))}</span>${b.map(x => `<span class="tw-b ${x[0]}">${esc(x[1])}</span>`).join("")}<span class="tw-b part" data-part hidden>${esc(t("tw.b.part"))}</span></div>
      <div class="tw-d">${esc(t("tw." + m.id + ".d"))}</div>${w ? `<div class="tw-w">${esc(w)}</div>` : ""}<div class="tw-n" data-note hidden></div><div class="tw-e" data-err hidden></div></div>
    <div class="tw-ctl"><span class="tw-ok">${ICONS.check}</span><span class="spin" data-spin hidden></span>${ctl}</div></div>`;
}
function renderTwCats() {
  const cats = ["all"].concat(TW_GROUPS);
  $("#twCats").innerHTML = cats.map(c => {
    const all = c === "all" ? TW.meta : TW.meta.filter(m => m.group === c);
    const on = all.filter(m => twIsOn(m.id)).length;
    return `<button class="tw-cat" data-cat="${c}" aria-pressed="${TW.cat === c}">${c === "all" ? ICONS.tweaks : ICONS[TW_ICON[c]]}<span>${esc(t(c === "all" ? "tw.cat.all" : "tw.g." + c))}</span><span class="c">${TW.loaded && all.length ? on + "/" + all.length : all.length || ""}</span></button>`;
  }).join("");
  $$("#twCats .tw-cat").forEach(b => b.addEventListener("click", () => { TW.cat = b.dataset.cat; renderTweaks(); $("#twBody").scrollTo({ top: 0, behavior: motionOK() ? "smooth" : "auto" }); }));
}
function renderTweaks() {
  if (!$("#twList")) return;
  renderTwCats();
  const list = $("#twList");
  if (!TW.meta.length) {
    list.innerHTML = `<div class="list">` + [0, 1, 2, 3, 4].map(() => `<div class="tw-row"><span class="skel" style="width:36px;height:36px;border-radius:50%"></span><div><span class="skel" style="width:220px"></span></div><span class="skel"></span></div>`).join("") + `</div>`;
    paintTwSummary(); return;
  }
  let html = "";
  (TW.cat === "all" ? TW_GROUPS : [TW.cat]).forEach(g => {
    const all = TW.meta.filter(m => m.group === g), items = all.filter(twVisible);
    if (!items.length) return;
    const on = all.filter(m => twIsOn(m.id)).length;
    html += `<div class="tw-sec"><span>${esc(t("tw.g." + g))}</span><span class="c">${TW.loaded ? on + "/" + all.length : ""}</span></div><div class="list">${items.map(twRowHtml).join("")}</div>`;
  });
  list.innerHTML = html || `<div class="list"><div class="tw-empty">${esc(t(TW.filter === "on" && !TW.q ? "tw.emptyOn" : "tw.empty"))}</div></div>`;
  list.querySelectorAll("[data-tw]").forEach(row => {
    const id = row.dataset.tw, sw = row.querySelector(".switch"), ch = row.querySelector("[data-choose]");
    if (sw) sw.addEventListener("change", () => toggleTweak(id, sw.checked));
    if (ch) ch.addEventListener("click", () => chooseDebloat());
    paintTweak(id);
  });
  paintTwSummary();
}
function paintTweak(id) {
  const row = document.querySelector(`#twList [data-tw="${id}"]`); if (!row) return;
  const m = twMeta(id) || {}, st = TW.state[id] || { state: TW.loaded ? "na" : "pending" };
  const busy = TW.busy === id, pending = st.state === "pending" || (!TW.loaded && !TW.state[id]);
  const admin = !!(S.info && S.info.admin);
  row.classList.toggle("on", st.state === "on");
  row.classList.toggle("part", st.state === "partial");
  row.classList.toggle("na", st.state === "na");
  row.querySelector("[data-part]").hidden = st.state !== "partial";
  const note = row.querySelector("[data-note]"); note.hidden = !st.note; note.textContent = st.note || "";
  const err = row.querySelector("[data-err]"); err.hidden = !TW.err[id]; err.textContent = TW.err[id] || "";
  row.querySelector("[data-spin]").hidden = !busy && !pending;
  const done = !!m.oneWay && st.state === "on" && !busy;
  row.classList.toggle("done", done);
  const sw = row.querySelector(".switch");
  if (sw) {
    if (!busy) sw.checked = st.state === "on" || st.state === "partial";
    sw.hidden = pending || done;
    sw.disabled = !!TW.busy || pending || st.state === "na" || !admin;
  }
  const ch = row.querySelector("[data-choose]");
  if (ch) { ch.hidden = pending || done; ch.disabled = !!TW.busy || st.state === "na" || !admin; }
}
function paintTwSummary() {
  if (!$("#twSumN")) return;
  const av = TW.meta.filter(m => { const s = (TW.state[m.id] || {}).state; return s && s !== "na"; });
  const on = av.filter(m => twIsOn(m.id)).length, total = av.length;
  const pending = !TW.loaded || TW.meta.some(m => (TW.state[m.id] || {}).state === "pending");
  $("#twOnNum").textContent = TW.loaded ? on : "—";
  $("#twSumN").textContent = TW.loaded ? t("tw.on", on, total) : t("tw.checking");
  $("#twRingVal").style.strokeDashoffset = String(194.78 * (1 - (total ? on / total : 0)));
  $("#twRefresh").classList.toggle("spin", pending && TW.loading);
  if (!$("#twRp").classList.contains("run")) paintTwRp();
  const b = $("#twBadge"); b.hidden = !TW.loaded || !on; b.textContent = on;
  $("#twExplorer").hidden = !TW.explorer; $("#twReboot").hidden = !TW.reboot;
  $("#twAdmin").hidden = !S.info || !!S.info.admin;
  renderTwCatsCounts();
}
function renderTwCatsCounts() {
  $$("#twCats .tw-cat").forEach(b => {
    const c = b.dataset.cat, all = c === "all" ? TW.meta : TW.meta.filter(m => m.group === c);
    b.querySelector(".c").textContent = TW.loaded && all.length ? all.filter(m => twIsOn(m.id)).length + "/" + all.length : (all.length || "");
  });
}
function paintTwRp(text) {
  const el = $("#twRp"); el.className = "rp";
  el.innerHTML = ICONS.shield + `<span>${esc(text || (S.settings.restorePoint ? t("tw.rpOn") : t("tw.rpOff")))}</span>`;
}
const twWillRP = m => !!m.sys && !!S.settings.restorePoint && !TW.rpDone;

function toggleTweak(id, want) {
  const m = twMeta(id);
  if (!m || TW.busy) { paintTweak(id); return; }
  const confirmIt = want && (m.risk || m.oneWay);
  if (!confirmIt) { runTweak(id, want, {}); return; }
  const list = [];
  const w = twWarn(id); if (w) list.push(w);
  if (m.oneWay) list.push(t("tw.oneWayNote"));
  if (m.reboot) list.push(t("tw.needReboot"));
  if (twWillRP(m)) list.push(t("tw.rpFirst"));
  confirmBox({
    title: twName(id), text: t("tw." + id + ".d"), list,
    okText: m.group === "apps" ? t("tw.okRemove") : t("tw.okApply"), danger: m.risk === "risky",
    ok: () => runTweak(id, want, {}), cancel: () => paintTweak(id),
  });
}
async function runTweak(id, want, opts) {
  if (TW.busy) return;
  TW.busy = id; delete TW.err[id];
  TW.meta.forEach(m => paintTweak(m.id));
  let r;
  try { r = await api.setTweak(id, want, Object.assign({ restorePoint: !!S.settings.restorePoint, apps: [] }, opts)); }
  catch (e) { r = { ok: false, error: String(e && e.message || e) }; }
  TW.busy = null;
  if (r && r.state && r.state.id) TW.state[id] = r.state;
  if (r && r.ok) {
    if (r.explorer) TW.explorer = true;
    if (r.reboot) TW.reboot = true;
    if (id === "debloat") toast(t("tw.debDone", (opts.apps || []).length));
    else toast(t(want ? "tw.toastOn" : "tw.toastOff", twName(id)), want ? "check" : "undo");
    if (r.note) setTimeout(() => toast(r.note, "cloud"), 400);
    const row = document.querySelector(`#twList [data-tw="${id}"]`);
    if (row && motionOK()) { row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
  } else {
    TW.err[id] = (r && r.error) || t("tw.failed");
    toast(twName(id) + " — " + t("tw.failed"), "alert", "warn");
  }
  if (TW.filter === "on") renderTweaks(); else TW.meta.forEach(m => paintTweak(m.id));
  paintTwSummary();
}
async function chooseDebloat() {
  if (TW.busy) return;
  TW.busy = "debloat"; paintTweak("debloat");
  let apps = [];
  try { apps = (await api.debloatApps()) || []; } catch (e) {}
  TW.busy = null; TW.meta.forEach(m => paintTweak(m.id));
  if (!apps.length) { TW.state.debloat = { id: "debloat", state: "on" }; paintTweak("debloat"); paintTwSummary(); toast(t("tw.debNone")); return; }
  const m = twMeta("debloat") || {};
  const html = apps.map(a => `<label class="extra"><input type="checkbox" class="cb" data-app="${esc(a.pkg)}" ${a.def ? "checked" : ""}><span>${esc(a.name)}</span></label>`).join("");
  confirmBox({
    title: t("tw.debTitle"), text: t("tw.debText"), extras: html, scrolly: true,
    list: twWillRP(m) ? [t("tw.rpFirst")] : [], okText: t("tw.okRemove"),
    ok: () => {
      const pick = $$("#mExtras [data-app]").filter(c => c.checked).map(c => c.dataset.app);
      if (pick.length) runTweak("debloat", true, { apps: pick });
    },
  });
  const upd = () => { const n = $$("#mExtras [data-app]").filter(c => c.checked).length; $("#mOk").textContent = t("tw.debSel", n); $("#mOk").disabled = !n; };
  $$("#mExtras [data-app]").forEach(c => c.addEventListener("change", upd)); upd();
}
function setupTwFilter() {
  makeSeg($("#twFilter"), [{ v: "all", label: t("tw.f.all") }, { v: "on", label: t("tw.f.on") }, { v: "rec", label: t("tw.f.rec") }], TW.filter, v => { TW.filter = v; renderTweaks(); });

let drives = [];
async function loadDrives() {
  if (S.busy && drives.length) return;
  if (!drives.length) $("#trimStatus").textContent = t("opt.loading");
  drives = (await api.getDrives()) || [];
  $("#trimStatus").textContent = "";
  renderDrives();
}
function renderDrives() {
  const list = $("#driveList");
  if (!drives.length) { list.innerHTML = `<div class="item"><span></span><div class="d">${esc(t("opt.none"))}</div><span></span></div>`; return; }
  list.innerHTML = drives.map(d => {
    const used = d.total - d.free, pct = d.total ? used / d.total * 100 : 0;
    const kind = d.media === "SSD" ? "SSD" : d.media === "HDD" ? "HDD" : t("opt.unknown");
    return `<div class="drive-row"><div class="letter">${esc(d.letter)}:</div>
      <div><div style="font-weight:600">${esc(d.label || t("opt.local"))} <span class="chip">${esc(kind)}</span></div><div class="mini"><i style="width:${pct}%"></i></div></div>
      <div class="mt">${esc(t("opt.free", fmt(d.free), fmt(d.total)))}</div>
      <div class="res" data-res="${esc(d.letter)}">${d.media === "HDD" ? esc(t("opt.hdd")) : ""}</div></div>`;
  }).join("");
  $("#btnTrim").disabled = S.busy || !drives.some(d => d.media !== "HDD");
}
$("#btnTrim").addEventListener("click", () => {
  setBusy(true); $("#trimStatus").textContent = t("opt.running");
  drives.filter(d => d.media !== "HDD").forEach(d => { const r = document.querySelector(`[data-res="${d.letter}"]`); if (r) { r.className = "res"; r.innerHTML = '<span class="spin"></span>'; } });

const ACCENTS = {
  blue: ["#2f6bff", "#5a8cff", "#4a80ff", "#a9c1ff", "#2052e8"], violet: ["#7c5cff", "#9b85ff", "#8a6dff", "#c3b5ff", "#6240e8"],

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(", "); }
function applyAccent(id) {
  const a = ACCENTS[id] || ACCENTS.blue, r = document.documentElement.style;
  r.setProperty("--blue", a[0]); r.setProperty("--blue-2", a[1]); r.setProperty("--blue-hi", a[2]);
  r.setProperty("--blue-light", a[3]); r.setProperty("--blue-deep", a[4]); r.setProperty("--blue-rgb", hexRgb(a[0]));
  const g = $$("#gGrad stop"), c = $$("#cGrad stop");
  g[0].setAttribute("stop-color", a[3]); g[1].setAttribute("stop-color", a[0]);
  c.forEach(x => x.setAttribute("stop-color", a[0]));

}

}

/* Keyboard shortcuts */
const PAGES = ["clean", "memory", "tweaks", "optimize", "repair", "settings", "credits"];
document.addEventListener("keydown", e => {
  if ($("#veil").classList.contains("on")) return;
  if (e.key === "F5") { e.preventDefault(); if (!S.busy) { go("clean"); analyze(); } return; }
  if (e.ctrlKey && (e.key === "f" || e.key === "F")) {
    e.preventDefault();
    if (S.page === "tweaks") { $("#twSearch").focus(); return; }
    go("clean"); setTimeout(() => $("#search").focus(), 60); return;
  }
  if (e.ctrlKey && /^[1-7]$/.test(e.key)) { e.preventDefault(); go(PAGES[+e.key - 1]); }
});
