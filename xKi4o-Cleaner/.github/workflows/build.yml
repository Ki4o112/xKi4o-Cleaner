name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet .

      - name: Build
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o xKi4oCleaner.exe .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: xKi4oCleaner
          path: xKi4oCleaner.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xKi4oCleaner.exe
          generate_release_notes: true
