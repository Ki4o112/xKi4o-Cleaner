/* 3.3: the splash as a short show — particles gather, the mark comes together, a flash, a light sweep,
   a turning arc while the scan runs, then the app comes in (transform and opacity only: smooth) */
:root { --expo: cubic-bezier(.16, 1, .3, 1); --quint: cubic-bezier(.22, 1, .36, 1); }
.splash { will-change: opacity, transform; }
.sp-rays { position: absolute; left: 50%; top: 40%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; pointer-events: none; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(70, 190, 154, .07) 0deg 4deg, transparent 4deg 18deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); mask-image: radial-gradient(closest-side, #000 8%, transparent 62%);
  animation: spRaysIn 1.6s var(--expo) 1.2s forwards, spSpin 60s linear infinite; }
@keyframes spRaysIn { to { opacity: 1; } }
.sp-parts { position: relative; width: 0; height: 0; }
.sp-parts i { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%;
  background: #a7f3d0; box-shadow: 0 0 8px #46be9a; opacity: 0; animation: spGather 1.15s var(--quint) var(--d) both; will-change: transform, opacity; }
@keyframes spGather { 0% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.6); } 25% { opacity: .9; } 85% { opacity: .9; } 100% { opacity: 0; transform: translate(0, 0) scale(.2); } }
.sp-flash { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(220, 255, 240, .9), rgba(70, 190, 154, .35) 45%, transparent 72%); opacity: 0;
  animation: spFlash 1.1s var(--expo) 1.25s both; }
@keyframes spFlash { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: .85; } 100% { opacity: 0; transform: scale(2.1); } }
.sp-arc { width: 152px; height: 152px; border-radius: 50%; opacity: 0;
  background: conic-gradient(from 0deg, transparent 0 62%, rgba(70, 190, 154, .1) 70%, #46be9a 97%, #dffff3 100%);
  -webkit-mask-image: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask-image: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  animation: spFade .9s var(--expo) 1.7s forwards, spSpin 1.6s linear 1.7s infinite; }
.sp-arc { animation-fill-mode: forwards, none; }
.splash-mark .sm-a { animation: smIn2 1.05s var(--expo) .55s both; --fx: -90px; --fy: 0px; --fr: -14deg; }
.splash-mark .sm-b { animation: smIn2 1.05s var(--expo) .72s both; --fx: 70px; --fy: -70px; --fr: 12deg; }
.splash-mark .sm-c { animation: smIn2 1.05s var(--expo) .89s both, smGlow 2.6s ease-in-out 2.2s infinite; --fx: 70px; --fy: 70px; --fr: -12deg; }
@keyframes smIn2 { 0% { opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.55); } 45% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.splash-mark { animation: spMarkPop .9s var(--expo) 1.25s both; }
@keyframes spMarkPop { 0% { transform: scale(1); } 30% { transform: scale(1.07); } 100% { transform: scale(1); } }
.sp-glow { animation: spGlowIn 1.2s var(--expo) .9s both, spBreathe 3.4s ease-in-out 2.2s infinite; }
.sp-ring { animation: spRing 2.8s var(--quint) 1.35s infinite; }
.sp-ring.r2 { animation-delay: 2.25s; } .sp-ring.r3 { animation-delay: 3.15s; }
.sp-orbit { animation: spFade 1s var(--expo) 1.8s both, spSpin 9s linear infinite; }
.sp-shine { animation: spShine 1.2s var(--quint) 1.6s both, spShineAgain 4.2s var(--quint) 3.4s infinite; }
.splash-name span { animation: spLetter2 .8s var(--expo) both; animation-delay: calc(1.75s + var(--i) * .045s); }
@keyframes spLetter2 { from { opacity: 0; transform: translateY(18px) rotateX(70deg); } }
.splash-name { perspective: 400px; }
.splash-by { animation: rise .8s var(--expo) 2.35s both; }
.splash-bar { animation: rise .8s var(--expo) 2.45s both; }
.splash-bar.det i { transition: width .3s linear; }
.splash-step { animation: rise .8s var(--expo) 2.55s both; }

/* ================= 3.3: motion across the app */
/* pages come in with their cards one after another */
.page.on { animation: pageIn2 .55s var(--expo); }
@keyframes pageIn2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page.enter .head > div:not(.head-ico):not(.head-r) { animation: headIn .6s var(--expo) both; }
.page.enter .head .head-r { animation: headIn .6s var(--expo) .08s both; }
@keyframes headIn { from { opacity: 0; transform: translateX(-14px); } }
.page.enter :is(.hm-dash > *, .hm-low > *, .hm-cards > *, .gp-live > *, .gp-grid > *, .si-grid > *, .su-stats > *, .twp-cards > *, .tw-pc, .da-vol, .dns-row, .gp-row, .list > .item, .cards > .card, .dh-card, .oss > *, .rc-cards > *, .mem-grid > *, .stats > *, .si-hero, .hm-hero, .gl) {
  animation: cardIn .7s var(--expo) both; animation-delay: calc(80ms + var(--k, 0) * 45ms); }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.page.enter :nth-child(2) { --k: 1; } .page.enter :nth-child(3) { --k: 2; } .page.enter :nth-child(4) { --k: 3; } .page.enter :nth-child(5) { --k: 4; }
.page.enter :nth-child(6) { --k: 5; } .page.enter :nth-child(7) { --k: 6; } .page.enter :nth-child(8) { --k: 7; } .page.enter :nth-child(9) { --k: 8; }
.page.enter :nth-child(10) { --k: 9; } .page.enter :nth-child(11) { --k: 10; } .page.enter :nth-child(n+12) { --k: 11; }
/* cards lift under the pointer */
:is(.si-card, .gl, .hm-card, .hm-x, .tw-pc, .da-vol, .dh-card) { transition: transform .35s var(--expo), border-color .25s, box-shadow .35s var(--expo); }
:is(.gl, .hm-card, .hm-x, .da-vol):hover { transform: translateY(-2px); border-color: rgba(var(--blue-rgb), .28); box-shadow: 0 16px 34px -24px rgba(var(--blue-rgb), .8); }
/* primary buttons: a light sweep on hover, a soft press */
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent); transform: skewX(-18deg); opacity: 0; }
.btn.primary:hover:not([disabled])::after { animation: btnSweep .85s var(--quint); }
@keyframes btnSweep { 0% { left: -60%; opacity: 1; } 100% { left: 130%; opacity: 1; } }
.btn:active:not([disabled]) { transform: scale(.965); }
/* the menu's icons answer the pointer */
.nav .ico svg { transition: transform .45s var(--expo); }
.nav button:hover .ico svg { transform: scale(1.14) rotate(-7deg); }
.nav button[aria-current="page"] .ico svg { animation: navPop .55s var(--expo); }
@keyframes navPop { 0% { transform: scale(.7) rotate(-20deg); } 100% { transform: none; } }
.nav-ind::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .07) 50%, transparent 70%); background-size: 250% 100%; animation: indSheen 4s ease-in-out infinite; }
@keyframes indSheen { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
/* toasts, dialogs and sheets with more spring */

.modal { animation: modalIn2 .55s var(--expo); }

/* switches slide with a little bounce */

/* live numbers fade when they change */

/* the refresh rate: a notification on top of everything */

.dd-adv { display: flex; flex-direction: column; gap: 6px; }
.dd-a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line-soft); }
.dd-a .btn svg { width: 15px; height: 15px; }

.dd-adv.ok .dd-ai { background: var(--mint-soft); color: var(--mint); }
.dd-at { font-size: 13px; line-height: 1.45; }
.dd-smh, .dd-sm { display: grid; grid-template-columns: 34px minmax(0, 1fr) 110px 110px; gap: 10px; align-items: center; padding: 7px 12px; }
.dd-smh { color: var(--faint); font-size: 11px; font-weight: 700; padding-top: 0; padding-bottom: 4px; }
.dd-sms { border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line-soft); overflow: hidden; }
.dd-sm { border-top: 1px solid var(--line-soft); font-size: 12.5px; }
.dd-sm:first-child { border-top: 0; }
.dd-sm .id { color: var(--faint); font: 11px var(--mono); }
.dd-sm .v { font-weight: 700; text-align: right; }
.dd-sm .q { color: var(--faint); font-size: 11.5px; text-align: right; }
.dd-smh span:nth-child(3), .dd-smh span:nth-child(4) { text-align: right; }
.dd-sm.warn .v { color: #ffcf8a; }
.dd-sm.bad .v, .dd-sm.bad .n { color: #ffb3bc; }
.dd-all { margin-top: 8px; }
.dd-all summary, .dd-ev summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.dd-all[open] summary { margin-bottom: 8px; }
.dd-nv { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.dd-ev { border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line-soft); padding: 10px 12px; margin-bottom: 6px; }
.dd-ev summary { display: flex; gap: 10px; align-items: baseline; list-style: none; }
.dd-ev summary::-webkit-details-marker { display: none; }
.dd-evn { color: var(--text); font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
.dd-evc { color: #ffcf8a; font-size: 12px; font-weight: 700; white-space: nowrap; }
.dd-evm { margin-top: 8px; color: var(--muted); font-size: 12px; user-select: text; line-height: 1.5; }
.dd-evm .k { display: block; color: var(--faint); font: 11px var(--mono); margin-bottom: 3px; }
@media (max-width: 1080px) { .dd-nv { grid-template-columns: repeat(3, minmax(0, 1fr)); } .drive-row { grid-template-columns: 44px minmax(0, 1fr) 150px 170px; } }

/* ---- cleaning that can never get stuck on "Starting…" ---- */
function cleanFailed(msg) {
  S.cleaning = false; setBusy(false);
  $("#cleanProg").hidden = true;
  for (const id in S.rowState) if (S.rowState[id].state === "queued" || S.rowState[id].state === "running") S.rowState[id] = { id, state: "skipped", note: msg };
  $("#cleanStatus").textContent = t("clean.failed", msg);
  toast(t("clean.failedT"), "alert", "warn");
  jobFinish("clean", "error", t("clean.failed", msg));
  refresh();
}
const alive = () => { S.lastEvent = performance.now(); };
on("clean-start", alive);
on("clean-error", d => { alive(); toast(d.error || t("tw.failed"), "alert", "warn"); });
setInterval(async () => {
  if (!S.cleaning || !native) return;
  if (performance.now() - (S.lastEvent || 0) < 15000) return;
  alive();
  let st = null; try { st = await api.cleanState(); } catch (e) {}
  if (!S.cleaning) return;
  if (!st || !st.busy) { cleanFailed(t("clean.lost")); return; }
  // still working (a long step): say what it is doing
  const what = st.phase === "restore" ? t("status.rp") : st.phase === "item" && st.item ? t("status.cleaning", itemName(st.item)) : t("status.working");
  $("#cleanStatus").textContent = what + " " + t("status.secs", secsClock(st.secs));
}, 3000);
function secsClock(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

/* ---- splash: shows the real first scan, 2–3 seconds ---- */
const SPL = { total: 0, got: 0, hidden: false };
// the splash's length: about 5 seconds for the show (quick in the page tests: ?fastsplash=1)
const SPL_FAST = /[?&]fastsplash=1/.test(location.search), SPL_MIN = SPL_FAST ? 250 : 4900, SPL_MAX = SPL_FAST ? 1500 : 6800;
function splashStep(text, pct) {
  const st = $("#splashStep"), bar = $("#splashBar");
  if (!st || SPL.hidden) return;
  st.textContent = text;
  if (pct != null) { SPL.target = Math.max(SPL.target || 0, Math.min(100, pct)); bar.classList.add("det"); splashBarTick(); }
}
// the bar follows the scan, but never runs ahead of the show: it fills smoothly over its length
function splashBarTick() {
  const bar = $("#splashBar"); if (!bar) return;
  const el = performance.now() - BOOT, cap = SPL.hidden ? 100 : 6 + 94 * Math.min(1, el / SPL_MIN);
  bar.querySelector("i").style.width = Math.max(4, Math.min(SPL.target || 0, cap)) + "%";
  if (!SPL.barT && !SPL.done) SPL.barT = setInterval(() => { splashBarTick(); if (!$("#splash")) { clearInterval(SPL.barT); SPL.done = true; } }, 120);
}
on("analyze-start", d => { SPL.total = d.total || 0; SPL.got = 0; });
function splashItem() {
  if (SPL.hidden) return;
  SPL.got++;
  const tot = SPL.total || GROUPS.reduce((n, g) => n + g.items.length, 0);
  splashStep(t("sp.scan", Math.min(SPL.got, tot), tot), 26 + 70 * Math.min(1, SPL.got / Math.max(1, tot)));
}
function maybeHideSplash(force) {
  if (SPL.hidden) return;
  const el = performance.now() - BOOT;
  if (force || (S.analyzed && el >= SPL_MIN - 500)) {
    splashStep(S.analyzed ? t("sp.ready", fmt(S.total || 0)) : t("sp.later"), 100);
    SPL.hidden = true;
    setTimeout(() => hideSplash(), S.analyzed ? 260 : 120);
  } else if (S.analyzed) setTimeout(() => maybeHideSplash(), SPL_MIN - 500 - el + 10);
}

/* ---- large dialog ("sheet") ---- */
let sheetCancel = null;
function openSheet(o) {
  $("#sheet").className = "sheet" + (o.wide ? " wide" : "");
  $("#shTitle").textContent = o.title || ""; $("#shSub").textContent = o.sub || ""; $("#shSub").hidden = !o.sub;
  $("#shTools").innerHTML = o.tools || ""; $("#shBody").innerHTML = o.body || ""; $("#shFoot").innerHTML = o.foot || "";
  paintIcons($("#sheet"));
  sheetCancel = o.onClose || null;
  $("#sveil").classList.add("on");
  $("#shBody").scrollTop = 0;
}
function closeSheet(cancelled) {
  if (!$("#sveil").classList.contains("on")) return;
  $("#sveil").classList.remove("on");
  const c = sheetCancel; sheetCancel = null;
  if (cancelled && c) c();
}
$("#shX").addEventListener("click", () => closeSheet(true));
$("#sveil").addEventListener("click", e => { if (e.target.id === "sveil") closeSheet(true); });

/* ---- preview of one category ---- */
async function openPreview(id) {
  if (S.cleaning) return;
  const PV = { id, entries: [], q: "" };
  openSheet({ wide: true, title: t("pv.title", itemName(id)), sub: t("pv.sub"),
    tools: `<label class="search"><span data-icon="search"></span><input id="pvSearch" type="search" spellcheck="false" autocomplete="off" placeholder="${esc(t("pv.search"))}"></label><button class="linkbtn" id="pvAll">${esc(t("pv.all"))}</button><button class="linkbtn" id="pvNone">${esc(t("pv.none"))}</button>`,
    body: `<div class="sh-empty"><span class="spin"></span></div>`,
    foot: `<span class="grow" id="pvSum"></span><button class="btn primary" id="pvDone">${esc(t("pv.done"))}</button>` });
  $("#pvDone").addEventListener("click", () => closeSheet(false));
  let r = null;
  try { r = await api.previewItem(id); } catch (e) {}
  if (!$("#sveil").classList.contains("on") || !$("#pvDone")) return;
  if (!r || (!r.tool && !(r.entries || []).length)) { $("#shBody").innerHTML = `<div class="sh-empty">${esc(t("pv.empty"))}</div>`; $("#pvSum").textContent = ""; return; }
  PV.entries = r.entries || [];
  const ex = () => (S.excl[id] = S.excl[id] || {});
  const sum = () => {
    if (r.tool) { $("#pvSum").textContent = r.total ? t("pv.toolSum", fmt(r.total)) : ""; return; }
    const e = S.excl[id] || {}; let b = r.total, f = r.files, n = 0;
    for (const p in e) { b -= e[p][0]; f -= e[p][1]; n++; }
    $("#pvSum").textContent = t("pv.sum", fmt(Math.max(0, b)), nfi(Math.max(0, f))) + (n ? " · " + t("row.excl", n) : "");
  };
  const draw = () => {
    const q = PV.q.toLowerCase(), e = S.excl[id] || {};
    const list = PV.entries.filter(x => !q || x.path.toLowerCase().includes(q));
    let html = r.tool ? `<div class="sh-note">${esc(t(id === "nvdrivers" ? "pv.drivers" : "pv.tool"))}</div>` : "";
    html += list.map((x, i) => {
      const name = x.path.split(/[\\/]/).pop(), dir = x.path.slice(0, x.path.length - name.length);
      const off = !!e[x.path];
      return `<div class="pv-row ${off ? "off" : ""}">${r.tool ? "<span></span>" : `<input type="checkbox" class="cb" data-pi="${PV.entries.indexOf(x)}" ${off ? "" : "checked"} aria-label="${esc(name)}">`}
        <div class="pv-p"><div class="pv-n" title="${esc(x.path)}">${x.dir ? ICONS.folder.replace('width="18" height="18"', 'width="13" height="13" style="vertical-align:-2px;margin-right:5px;color:var(--blue-2)"') : ""}${esc(name)}</div><div class="pv-d"><bdi>${esc(dir)}</bdi></div></div>
        <div class="pv-s">${fmt(x.size)}${x.dir && x.files ? `<small>${esc(t("row.files", nfi(x.files)))}</small>` : ""}</div>
        ${r.tool ? "<span></span>" : `<button class="ibtn" data-po="${PV.entries.indexOf(x)}" title="${esc(t("pv.open"))}" aria-label="${esc(t("pv.open"))}">${ICONS.open}</button>`}</div>`;
    }).join("");
    if (!list.length && !r.tool) html += `<div class="sh-empty">${esc(t("table.noMatch", PV.q))}</div>`;
    if (r.more && !q) html += `<div class="sh-note">${esc(t("pv.more", nfi(r.more)))}</div>`;
    $("#shBody").innerHTML = html;
    $$("#shBody [data-pi]").forEach(cb => cb.addEventListener("change", () => {
      const x = PV.entries[+cb.dataset.pi];
      if (cb.checked) delete ex()[x.path]; else ex()[x.path] = [x.size, x.dir ? x.files : 1];
      if (!Object.keys(ex()).length) delete S.excl[id];
      cb.closest(".pv-row").classList.toggle("off", !cb.checked); S.dryShown = false; sum(); refresh(); renderCards();
    }));
    $$("#shBody [data-po]").forEach(b => b.addEventListener("click", () => api.showInFolder(PV.entries[+b.dataset.po].path)));
    sum();
  };
  draw();
  $("#pvSearch").addEventListener("input", e => { PV.q = e.target.value.trim(); draw(); });
  $("#pvAll").addEventListener("click", () => { delete S.excl[id]; draw(); refresh(); renderCards(); });
  $("#pvNone").addEventListener("click", () => { if (r.tool) return; const e = ex(); PV.entries.forEach(x => { e[x.path] = [x.size, x.dir ? x.files : 1]; }); draw(); refresh(); renderCards(); });
  $("#pvAll").hidden = $("#pvNone").hidden = !!r.tool;
}

/* ---- programs that stop the cleaning ---- */
async function checkAndShowBlockers(ids, extra) {
  setBusy(true); $("#cleanStatus").textContent = t("blk.checking");
  let rep = null;
  try { rep = await api.checkBlockers(ids); } catch (e) {}
  setBusy(false);
  if (!rep || !(rep.apps || []).length) { $("#cleanStatus").textContent = t("blk.none"); analyze(); return; }
  showBlockers(rep, ids, extra);
}
// extra === null: opened from the "app is open" notice (closing only, no cleaning)
function showBlockers(rep, ids, extra) {
  // force: the setting "close apps by force" (on unless turned off) ends them at once
  const BK = { rep, ids, extra, sel: {}, res: {}, busy: false, reopen: false, onlyClose: extra === null, force: S.settings.forceClose !== false };
  (rep.apps || []).forEach(a => { if (a.closable) BK.sel[a.key] = true; });
  const kindLabel = a => a.kind === "background" ? t("blk.kBg") : a.kind === "service" ? t("blk.kSvc") : a.kind === "windows" ? t("blk.kWin") : a.kind === "security" ? t("blk.kSec") : a.kind === "other-user" ? t("blk.kUser") : "";
  const appIcon = a => { const id = (a.items || [])[0]; const fb = a.running && AVATAR[id] ? itemIcon(id) : `<span class="r-ico">${ICONS.apps}</span>`; return a.path ? ico("exe:" + a.path, "r-ico", ICONS.apps) : fb; };
  const render = () => {
    const apps = BK.rep.apps || [];
    const closable = apps.filter(a => a.closable);
    let body = apps.map(a => {
      const r = BK.res[a.key];
      const reason = a.running ? t("blk.rRun") : t("blk.rHold", nfi(a.files), fmt(a.bytes));
      const st = BK.busy && BK.sel[a.key] && a.closable ? '<span class="spin"></span>'
        : r ? (r.closed ? `<span class="bk-st ok">${esc(t("blk.closed"))}</span>` : `<span class="bk-st bad">${esc(t("blk.open"))}</span><br><button class="linkbtn" data-force="${esc(a.key)}">${esc(t("blk.force"))}</button>`) : "";
      return `<div class="bk-row ${a.closable ? "" : "no"}">
        ${a.closable ? `<input type="checkbox" class="cb" data-bk="${esc(a.key)}" ${BK.sel[a.key] ? "checked" : ""} ${BK.busy ? "disabled" : ""} aria-label="${esc(a.name)}">` : `<span title="${esc(t("blk.cant"))}">${ICONS.lock.replace('width="18" height="18"', 'width="16" height="16" style="color:var(--faint)"')}</span>`}
        ${appIcon(a)}
        <div style="min-width:0"><div class="bk-t"><span>${esc(a.name)}</span>${kindLabel(a) ? `<span class="tw-b">${esc(kindLabel(a))}</span>` : ""}</div>
          <div class="bk-d">${esc(a.closable ? reason : a.why || t("blk.cant"))}</div>
          <div class="bk-c">${esc(t("blk.affects", joinL((a.items || []).map(itemName))))}</div></div>
        <div style="text-align:right">${st}</div></div>`;
    }).join("");
    if (BK.rep.partial) body += `<div class="sh-note">${esc(t("blk.partial", nfi(BK.rep.probed || 0)))}</div>`;
    const nsel = closable.filter(a => BK.sel[a.key]).length, dis = BK.busy ? "disabled" : "";
    const foot = (closable.length && !BK.force ? `<label class="chk grow"><input type="checkbox" class="cb" id="bkReopen" ${BK.reopen ? "checked" : ""} ${dis}><span>${esc(t("blk.reopen"))}</span></label>` : `<span class="grow"></span>`)
      + (BK.onlyClose ? "" : `<button class="btn small" id="bkSkipApps" ${dis}>${esc(t("blk.skipApps"))}</button><button class="btn small" id="bkSkipLocked" ${dis}>${esc(t("blk.skipLocked"))}</button>`)
      + `<button class="btn small" id="bkRecheck" ${dis}>${esc(t("blk.recheck"))}</button>`
      + (closable.length ? `<button class="btn small" id="bkCloseSel" ${dis || (nsel ? "" : "disabled")}>${esc(t(BK.force ? "blk.closeSelF" : "blk.closeSel"))}</button><button class="btn small ${BK.force ? "danger" : "primary"}" id="bkCloseAll" ${dis}>${esc(t(BK.force ? "blk.closeAllF" : "blk.closeAll"))}</button>` : "");
    const keepScroll = $("#sveil").classList.contains("on") ? $("#shBody").scrollTop : 0;
    openSheet({ wide: true, title: t(BK.onlyClose ? "blk.titleClose" : "blk.title"), sub: t(BK.force ? "blk.subForce" : "blk.sub"), body, foot,
      onClose: () => { if (!BK.onlyClose) $("#cleanStatus").textContent = t("blk.cancelled"); } });
    $("#shBody").scrollTop = keepScroll;
    $$("#shBody [data-bk]").forEach(cb => cb.addEventListener("change", () => { BK.sel[cb.dataset.bk] = cb.checked; render(); }));
    $$("#shBody [data-force]").forEach(b => b.addEventListener("click", () => forceOne(b.dataset.force)));
    const on2 = (sel, f) => { const el = $(sel); if (el) el.addEventListener("click", f); };
    on2("#bkReopen", () => { BK.reopen = $("#bkReopen").checked; });
    on2("#bkSkipApps", () => { closeSheet(false); cleanNow(BK.ids, Object.assign({}, BK.extra, { openApps: "skip" })); });
    on2("#bkSkipLocked", () => { closeSheet(false); cleanNow(BK.ids, Object.assign({}, BK.extra, { openApps: "partial" })); });
    on2("#bkRecheck", () => recheck());
    on2("#bkCloseSel", () => closeKeys(closable.filter(a => BK.sel[a.key]).map(a => a.key)));
    on2("#bkCloseAll", () => closeKeys(closable.map(a => a.key)));
  };
  const proceed = () => {
    closeSheet(false);
    if (BK.onlyClose) { toast(t("blk.clear")); analyze(); return; }
    toast(t("blk.clear"));
    cleanNow(BK.ids, Object.assign({}, BK.extra, { openApps: "skip", reopen: BK.reopen }));
  };
  const recheck = async () => {
    BK.busy = true; render();
    let r = null;
    try { r = await api.checkBlockers(BK.ids); } catch (e) {}
    BK.busy = false;
    if (r) BK.rep = r;
    // nothing that can be closed is in the way any more: go on
    if (!(BK.rep.apps || []).some(a => a.closable)) { proceed(); return; }
    // keep the result notes only for apps still listed
    const keys = new Set((BK.rep.apps || []).map(a => a.key));
    for (const k in BK.res) if (!keys.has(k)) delete BK.res[k];
    (BK.rep.apps || []).forEach(a => { if (a.closable && BK.sel[a.key] === undefined) BK.sel[a.key] = true; });
    render();
  };
  const closeKeys = async keys => {
    if (!keys.length || BK.busy) return;
    keys.forEach(k => BK.sel[k] = true);
    BK.busy = true; render();
    let res = [];
    try { res = (await (BK.force ? api.forceCloseBlockers(keys) : api.closeBlockers(keys, BK.reopen))) || []; } catch (e) {}
    res.forEach(r => { BK.res[r.key] = r; });
    const closed = res.filter(r => r.closed).map(r => r.name);
    if (closed.length) toast(t("blk.closedN", joinL(closed)));
    await recheck();
  };
  const forceOne = key => {
    const a = (BK.rep.apps || []).find(x => x.key === key); if (!a) return;
    confirmBox({ title: t("blk.forceTitle", a.name), text: t("blk.forceText"), list: [t("blk.forceWarn")], okText: t("blk.forceOk"), danger: true,
      ok: async () => {
        BK.busy = true; render();
        let res = [];
        try { res = (await api.forceCloseBlockers([key])) || []; } catch (e) {}
        res.forEach(r => { BK.res[r.key] = r; });
        await recheck();
      } });
  };
  render();
}

/* ---- report of the last cleaning or preview ---- */
function openReport() {
  const R = S.lastReport; if (!R) return;
  const d = R.d, dry = !!d.dryRun;
  const sumB = k => R.rows.reduce((s, r) => s + (r[k] || 0), 0);
  const stat = (k, v, sub, cls) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${esc(v)}</div><div class="k">${esc(sub)}</div></div>`;
  let body = `<div class="rp-sum">
    ${stat(t(dry ? "rpt.would" : "rpt.deleted"), fmt(d.freed || 0), t("row.files", nfi(d.files || 0)))}
    ${stat(t(dry ? "rpt.inUse" : "rpt.locked"), nfi(d.locked || 0), fmt(sumB("lockedBytes")))}
    ${stat(t("rpt.denied"), nfi(d.denied || 0), fmt(sumB("deniedBytes")))}
    ${stat(t("rpt.failed"), nfi(d.failed || 0), fmt(sumB("failedBytes")))}</div>`;
  if (!dry) body += `<div class="sh-note">${esc(t("rpt.delta", R.letter, (d.driveDelta >= 0 ? "+" : "−") + fmt(Math.abs(d.driveDelta || 0))))}</div>`;
  else body += `<div class="sh-note">${esc(t("rpt.dryNote"))}</div>`;
  const kind = { locked: t(dry ? "rpt.kInUse" : "rpt.kLocked"), denied: t("rpt.kDenied"), failed: t("rpt.kFailed") };
  body += `<table class="rp-tab"><thead><tr><th>${esc(t("rpt.cat"))}</th><th>${esc(t(dry ? "rpt.would" : "rpt.deleted"))}</th><th>${esc(t(dry ? "rpt.inUse" : "rpt.locked"))}</th><th>${esc(t("rpt.denied"))}</th><th>${esc(t("rpt.failed"))}</th></tr></thead><tbody>`;
  const cell = (n, b, cls) => n ? `<span class="${cls}">${nfi(n)}</span><div class="sub2">${fmt(b)}</div>` : `<span class="z">0</span>`;
  R.rows.forEach(r => {
    const name = r.id === "ram" || r.id === "trim" ? t("it." + r.id + ".n") : itemName(r.id);
    let first = esc(name);
    if (r.state === "skipped") first += `<div class="sub2">${esc(t("row.skipped"))}${r.note ? " — " + esc(r.note) : ""}</div>`;
    else if (r.state === "failed") first += `<div class="sub2" style="color:#ffb3bc">${esc(r.note || t("row.failed"))}</div>`;
    else if (r.tool) first += `<div class="sub2">${esc(t(r.planned ? "rpt.toolPlan" : "rpt.tool"))}</div>`;
    else if (r.note) first += `<div class="sub2">${esc(r.note)}</div>`;
    if ((r.issues || []).length) {
      const lines = r.issues.map(i => `${kind[i.kind] || i.kind}\t${fmt(i.size)}\t${i.path}`).join("\n");
      const more = leftCount(r) - r.issues.length;
      first += `<details><summary class="linkbtn">${esc(t("rpt.files", nfi(leftCount(r))))}</summary><div class="rp-iss">${esc(lines)}${more > 0 ? "\n" + esc(t("rpt.more", nfi(more))) : ""}</div></details>`;
    }
    const done = r.state === "done" || r.state === "failed";
    body += `<tr><td>${first}</td><td>${done ? (r.freed > 0 || r.files ? `<span class="ok">${fmt(r.freed || 0)}</span><div class="sub2">${r.tool && !r.files ? "" : esc(t("row.files", nfi(r.files || 0)))}</div>` : `<span class="z">0</span>`) : "—"}</td>
      <td>${cell(r.locked, r.lockedBytes, "warn")}</td><td>${cell(r.denied, r.deniedBytes, "warn")}</td><td>${cell(r.failed, r.failedBytes, "bad")}</td></tr>`;
  });
  body += `</tbody></table>`;
  if ((d.locked || 0) + (d.denied || 0) + (d.failed || 0) > 0) body += `<div class="sh-note">${esc(t(dry ? "rpt.whyDry" : "rpt.why"))}</div>`;
  openSheet({ wide: true, title: t(dry ? "rpt.titleDry" : "rpt.title"), sub: new Date(R.at).toLocaleString(locale()) + " · " + secs(R.secs), body,
    foot: `<button class="btn" id="rpRescan">${esc(t("btn.scan"))}</button><button class="btn primary" id="rpClose">${esc(t("modal.closeBtn"))}</button>` });
  $("#rpClose").addEventListener("click", () => closeSheet(false));
  $("#rpRescan").addEventListener("click", () => { closeSheet(false); if (!S.busy) analyze(); });
}

function setupMemSegs() {

    let d = `M${xy[0][0].toFixed(1)},${xy[0][1].toFixed(1)}`;

function paintTweak(id) {

function renderTwCatsCounts() {

const twWillRP = m => !!m.sys && !!S.settings.restorePoint && !TW.rpDone;

function toggleTweak(id, want) {

      ok: () => runTweak(id, false, Object.assign({}, opts, { useDefaults: true })), cancel: () => paintTweak(id) });

function tmWorst(row, side) {

function squarify(vals, x, y, w, h) {

    while (i < items.length) { const nr = row.concat([items[i]]), wv = tmWorst(nr, side); if (wv > best) break; row = nr; best = wv; i++; }

}

// "### English" / "### Български" parts of release notes: the one in the app's language
function notesFor(md, lang) {
  const lines = String(md || "").replace(/\r/g, "").split("\n");
  const langOf = l => { const m = /^(#{1,4})\s*(English|Български|Bulgarian)\s*$/i.exec(l.trim()); return m ? { lv: m[1].length, k: /english/i.test(m[2]) ? "en" : "bg" } : null; };

  for (const l of lines) {
    const g = langOf(l);
    if (g) { cur = g.k; lv = g.lv; continue; }
    const h = /^(#{1,4})\s/.exec(l.trim());
    if (h && h[1].length <= lv) cur = null;
    if (cur === lang) out.push(l);

}
// the "## 2.6.1" part of the changelog

  if (worst === 2) add("space", "bad", 20); else if (worst === 1) add("space", "warn", 10);

  const ln = (a, b) => `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  let d = "", g = "";

const PR = { tab: "apps", apps: null, store: null, loading: false, storeLoading: false, q: "", sort: "name", dir: 1, admin: true, upd: null, updLoading: false, wg: {}, wgSel: null, wgRun: false, measuring: false };

  if (S.page === "programs") renderPrograms();
